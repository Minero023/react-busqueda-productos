<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista VIP - Club Neón</title>
  <script src="script.js" defer></script>
  <style>
    :root {
      --bg-color: #0d0d15;
      --card-bg: #161626;
      --primary-neon: #ff007f;
      --secondary-neon: #00f0ff;
      --error-color: #ff3333;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
    }

    .registration-card {
      background: var(--card-bg);
      border: 2px solid rgba(255, 0, 127, 0.3);
      border-radius: 16px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.2), 0 0 10px rgba(0, 240, 255, 0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 8px var(--primary-neon), 0 0 20px var(--primary-neon);
    }

    .header p {
      color: var(--secondary-neon);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ccc;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: var(--secondary-neon);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .form-control option {
      background-color: var(--card-bg);
      color: #fff;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      font-size: 0.85rem;
      color: #bbb;
    }

    .checkbox-group input {
      accent-color: var(--primary-neon);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }

    .alert-msg {
      display: none;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .success-msg {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--secondary-neon);
      color: var(--secondary-neon);
    }

    .error-msg {
      background: rgba(255, 51, 51, 0.15);
      border: 1px solid var(--error-color);
      color: var(--error-color);
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
    }
  </style>
</head>
<body>

  <div class="registration-card">
    <div class="header">
      <h1>NIGHT CLUB VIP</h1>
      <p>Regístrate para ingresar a la Lista Preferencial</p>
    </div>

    <form id="neonForm">
      <div class="form-group">
        <label for="fullName">Nombre Completo</label>
        <input type="text" id="fullName" class="form-control" placeholder="Ej. Carlos Mendoza" required>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="phone">Teléfono / WhatsApp</label>
          <input type="tel" id="phone" class="form-control" placeholder="+34 600000000" required>
        </div>
      </div>

      <!-- CAMPO AÑADIDO: Fecha de Nacimiento -->
      <div class="form-group">
        <label for="birthDate">Fecha de Nacimiento</label>
        <input type="date" id="birthDate" class="form-control" required>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label for="eventDate">Fecha de Asistencia</label>
          <input type="date" id="eventDate" class="form-control" required>
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="guests">Acompañantes</label>
          <select id="guests" class="form-control">
            <option value="0">Solo yo</option>
            <option value="1">+1 Persona</option>
            <option value="2">+2 Personas</option>
            <option value="3">+3 Personas</option>
            <option value="4">+4 o más (Mesa)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="zone">Zona de Preferencia</label>
        <select id="zone" class="form-control">
          <option value="pista">Pista Principal</option>
          <option value="vip">Zona VIP</option>
          <option value="terraza">Terraza Ultra</option>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="termsCheck" required>
        <label for="termsCheck">Acepto los términos y condiciones de la discoteca.</label>
      </div>

      <button type="submit" class="btn-submit">Asegurar Entrada VIP</button>
    </form>

    <!-- Contenedores de mensajes -->
    <div id="errorMessage" class="alert-msg error-msg"></div>
    <div id="successMessage" class="alert-msg success-msg"></div>
  </div>

  <!-- Vinculación del archivo JS externo -->
  <script src="script.js"></script>
</body>
</html>
