<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <form>
        <!-- Datos Generales -->
        <fieldset>

            <legend class="form-label fw-semibold">Datos Generales</legend>
            <input list="ciudades" class="form-control" placeholder="Seleccione una ciudad" name="ciudades" required>
            <datalist id="ciudades">
                    <option value="Ibarra" ></option>
                    <option value="Guayaquil" ></option>
                    <option value="Quito" ></option>
                    <option value="Esmeraldas" ></option>
                    <option value="Atacames" ></option>
                    <option value="Quininde" ></option>
            </datalist>
        </fieldset>
        <br>
        <!-- Servicios -->
        <fieldset>
            <legend class="form-label fw-semibold">Servicios</legend>
            <input type="range" class="form-range" min="0" max="10" step="1" id="rango1" output="rangeValue" name="rango1" required>
        </fieldset>
        <!-- Comentarios -->
        <fieldset>
            <legend class="form-label fw-semibold">Comentarios</legend>
            <h6>Color sugerido para el uniforme</h6>
            <input type="color" class="form-control form-control-color" id="color1" value="#563d7c" title="Choose your color" name="color1" required>
            <h6>Comentario Libre</h6>
            <textarea class="form-control" id="comet1" rows="3" placeholder="Ingrese su comentario" maxlength="300" name="comet1" required></textarea>
            <br>
            <br>
            <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm">
                Enviar información
            </button>
        </fieldset>
        </form>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
