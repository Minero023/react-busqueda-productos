<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="D:\Desarrollo de aplicaciones web (Andrée Valencia)\JS\factrura.js" defer></script>
    </head>
    <body>
        <div class="container-xs bg-warning">
            <h2>Factura Lico 5toA</h2>
            <!-- Aqui la info de el cliente-->
            <section>
                <div class="bg-secondary">
                    <label>Cliente: </label>
                    <input type="text" id="nombrecliente"/>
                    <label>Cedula: </label>
                    <input type="text" id="cedulacliente"/>
                    <label>Sexo: </label>
                    <input type="text" id="sexocliente"/>
                </div>

            </section>

            <!-- Aqui la info de los productos-->
            <section>
                <div class="bg-primary">
                    <h4>Agregar Productos:</h4>
                    <label>Producto: </label>
                    <input type="text" id="producto"/>
                    <label>Catidad: </label>
                    <input type="number" id="cantidad" />
                    <label>Precio: </label>
                    <input type="number" id="precio" />
                    <button id="btnAgregarProducto">Agregar Producto</button>
                </div>
                <div>
                    <h5>Lista de productos: </h5>
                    <table border="3">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="detalleFactura">
                            
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Aqui la info de los totales-->
            <section>
                <div class="bg-secondary container-xs d-flex justify-content-end">
                    <h4>Resumen de la factura</h4>
                    <br>
                    <br>
                    <label id="subtotalm">Subtotal</label>
                    <br>
                    <label id="IVA">IVA</label>
                    <br>
                    <label id="totalf">Total</label>
                    <br>
                </div>
            </section>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
